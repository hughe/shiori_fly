# fly.toml app configuration file generated for shiori-emberson on 2026-01-25T17:44:43+13:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shiori-emberson'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile.fly'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

# Create volume like this:
#
#   fly volume create shiori_emberson_data -r dfw -n 1
[mounts]
  source = "shiori_emberson_data"
  destination = "/mnt/shiori"

# Add a cname like this:
#
# fly certs add shiori.emberson.net