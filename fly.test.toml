# Test app for the Alpine 3.24 / Shiori v1.8.0 upgrade (see TODO.md).
# Deploy with: fly deploy -c fly.test.toml
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shiori-emberson-test'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile.fly'

[build.args]
  SHIORI_VERSION = 'v1.7.4'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

# Create volume like this:
#
#   fly volume create shiori_emberson_test_data -a shiori-emberson-test -r dfw -n 1
[mounts]
  source = "shiori_emberson_test_data"
  destination = "/mnt/shiori"

# No cert/CNAME: use https://shiori-emberson-test.fly.dev
